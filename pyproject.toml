[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "masck-one-cad"
version = "0.1.0"
description = "Deterministic engineering and code-CAD foundation for Masck One"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cadquery==2.8.0",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
masck-one-cad = "masck_one.cli:main"
masck-one-preflight = "masck_one.preflight:main"
masck-one-authority-check = "masck_one.authority:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

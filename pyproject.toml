[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "masck-one-cad"
version = "0.1.0"
description = "Deterministic engineering and product-identity foundation for Masck One within the MASCK personal-care hardware brand"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cadquery==2.8.0",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  # The CAD suite is CPU-bound and independent per test; running it serially
  # exceeded the CI job budget. See .github/workflows/ci.yml.
  "pytest-xdist==3.8.0",
]

[project.scripts]
masck-one-cad = "masck_one.cli:main"
masck-one-preflight = "masck_one.preflight:main"
masck-one-authority-check = "masck_one.authority:main"
masck-brand-check = "masck_one.brand_identity:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

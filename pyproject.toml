[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masck-one"
version = "0.1.0"
description = "Engineering code, parametric CAD and validation tooling for Masck One"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cadquery==2.8.0",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.25,<5",
  "trimesh>=4.8,<5",
  "numpy>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-xdist>=3.8,<4",
]

[project.scripts]
masck-one = "masck_one.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

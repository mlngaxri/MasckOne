<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">How the documented Masck One system fits together</title>
  <desc id="desc">Reviewer-facing orientation diagram separating the documented dock and preparation area, which is separate from the wearable, from the wearable system area. It is a simplified, non-exhaustive major-subsystem map, not a bill of materials, build-status diagram or physical-validation result. The wearable system area contains the documented skincare product storage and delivery, facial interface and treatment mechanics, waste recovery and cartridges, retention structure and removal, plus a supporting electronics, controls and software layer. Plain-language subtitles explain each subsystem for non-technical review without changing the documented architecture. A visible orientation only, documentation map, not test evidence badge identifies the evidence class before the diagram is interpreted. Solid lines show documented product relationships; dashed lines show documented supporting relationships. Lines are deliberately non-directional because the diagram does not establish validated fluid, skincare-product or control flow. Diagram position and spacing are schematic and do not represent physical placement, size or scale. The boxes identify documented subsystem areas, not completed hardware. The diagram verifies documented system scope and relationships only; it does not verify hardware, physical integration or performance.</desc>
  <defs>
    <style>
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .subtitle { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; }
      .badge { font: 700 11px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #374151; text-anchor: middle; letter-spacing: 0.6px; }
      .zone { font: 700 11px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #6b7280; text-anchor: middle; letter-spacing: 1px; }
      .node-title { font: 650 16px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; text-anchor: middle; }
      .node-sub { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; text-anchor: middle; }
      .legend { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; }
      .boundary-note { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; text-anchor: middle; }
      .footer { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #374151; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 16; }
      .support { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; rx: 16; }
      .zone-box { fill: none; stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 5; rx: 18; }
      .relationship { fill: none; stroke: #4b5563; stroke-width: 2; }
      .support-relationship { fill: none; stroke: #6b7280; stroke-width: 1.7; stroke-dasharray: 7 6; }
      .legend-solid { fill: none; stroke: #4b5563; stroke-width: 2; }
      .legend-dashed { fill: none; stroke: #6b7280; stroke-width: 1.7; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="960" height="500" fill="#ffffff"/>
  <rect x="24" y="22" width="280" height="26" rx="13" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="164" y="39" class="badge">ORIENTATION ONLY · DOCUMENTATION MAP · NOT TEST EVIDENCE</text>
  <text x="480" y="44" class="title" text-anchor="middle">How the documented Masck One system fits together</text>
  <text x="480" y="70" class="subtitle" text-anchor="middle">Major documented relationships only; not what has been built or physically validated</text>

  <rect x="42" y="153" width="206" height="118" class="zone-box"/>
  <text x="145" y="148" class="zone">SEPARATE DOCK / PREPARATION</text>
  <rect x="258" y="82" width="660" height="312" class="zone-box"/>
  <text x="588" y="92" class="zone">WEARABLE</text>

  <rect x="55" y="170" width="180" height="84" class="box"/>
  <text x="145" y="203" class="node-title">Dock and preparation</text>
  <text x="145" y="226" class="node-sub">prepare before wearing</text>

  <rect x="270" y="170" width="180" height="84" class="box"/>
  <text x="360" y="203" class="node-title">Skincare products</text>
  <text x="360" y="226" class="node-sub">store and deliver</text>

  <rect x="485" y="170" width="190" height="84" class="box"/>
  <text x="580" y="203" class="node-title">Facial interface</text>
  <text x="580" y="226" class="node-sub">face contact and treatment</text>

  <rect x="710" y="170" width="195" height="84" class="box"/>
  <text x="807.5" y="203" class="node-title">Waste recovery</text>
  <text x="807.5" y="226" class="node-sub">collect used liquid</text>

  <path d="M235 212 H270" class="relationship"/>
  <path d="M450 212 H485" class="relationship"/>
  <path d="M675 212 H710" class="relationship"/>

  <rect x="485" y="300" width="190" height="82" class="support"/>
  <text x="580" y="332" class="node-title">Retention and structure</text>
  <text x="580" y="355" class="node-sub">hold on face and remove</text>
  <path d="M580 300 V254" class="relationship"/>

  <rect x="270" y="100" width="410" height="49" class="support"/>
  <text x="475" y="120" class="node-title">Electronics, controls and software</text>
  <text x="475" y="140" class="node-sub">documented supporting layer</text>

  <path d="M330 149 C290 158 220 160 170 170" class="support-relationship"/>
  <path d="M405 149 C390 158 375 162 360 170" class="support-relationship"/>
  <path d="M535 149 C550 158 565 162 580 170" class="support-relationship"/>
  <path d="M620 149 C675 156 745 160 790 170" class="support-relationship"/>

  <line x1="285" y1="400" x2="325" y2="400" class="legend-solid"/>
  <text x="335" y="404" class="legend">documented product relationship</text>
  <line x1="515" y1="400" x2="555" y2="400" class="legend-dashed"/>
  <text x="565" y="404" class="legend">documented supporting relationship</text>
  <text x="480" y="420" class="boundary-note">Lines show relationships only. They do not assert direction or validated fluid, skincare-product or control flow.</text>
  <text x="480" y="436" class="boundary-note">Schematic layout only. Position, spacing and box size do not represent physical placement or scale.</text>

  <rect x="105" y="448" width="750" height="36" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="471" class="footer">Verifies documented system scope and relationships only. Does not verify hardware, integration or performance.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Masck One documented whole-product architecture</title>
  <desc id="desc">Reviewer-facing documentation diagram showing dock and preparation, product storage and delivery, facial interface and treatment mechanics, waste recovery and cartridges, retention structure and removal, and electronics controls and software. The diagram summarises documented subsystem relationships only and does not prove implementation or physical validation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .subtitle { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; }
      .node-title { font: 650 16px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; text-anchor: middle; }
      .node-sub { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; text-anchor: middle; }
      .footer { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #374151; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 16; }
      .support { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; rx: 16; }
      .arrow { fill: none; stroke: #4b5563; stroke-width: 2; marker-end: url(#arrow); }
      .control-arrow { fill: none; stroke: #6b7280; stroke-width: 1.7; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="44" class="title" text-anchor="middle">Masck One documented system architecture</text>
  <text x="480" y="70" class="subtitle" text-anchor="middle">A reviewer-facing map of existing documented subsystem relationships</text>

  <rect x="55" y="170" width="180" height="84" class="box"/>
  <text x="145" y="203" class="node-title">Dock and preparation</text>
  <text x="145" y="226" class="node-sub">off-face preparation</text>

  <rect x="270" y="170" width="180" height="84" class="box"/>
  <text x="360" y="203" class="node-title">Product storage</text>
  <text x="360" y="226" class="node-sub">and delivery</text>

  <rect x="485" y="170" width="190" height="84" class="box"/>
  <text x="580" y="203" class="node-title">Facial interface</text>
  <text x="580" y="226" class="node-sub">and treatment mechanics</text>

  <rect x="710" y="170" width="195" height="84" class="box"/>
  <text x="807.5" y="203" class="node-title">Waste recovery</text>
  <text x="807.5" y="226" class="node-sub">and cartridges</text>

  <path d="M235 212 H265" class="arrow"/>
  <path d="M450 212 H480" class="arrow"/>
  <path d="M675 212 H705" class="arrow"/>

  <rect x="485" y="300" width="190" height="82" class="support"/>
  <text x="580" y="332" class="node-title">Retention, structure</text>
  <text x="580" y="355" class="node-sub">and removal</text>
  <path d="M580 300 V260" class="arrow"/>

  <rect x="270" y="95" width="410" height="54" class="support"/>
  <text x="475" y="126" class="node-title">Electronics, controls and software</text>

  <path d="M330 149 C290 158 220 160 170 168" class="control-arrow"/>
  <path d="M405 149 C390 158 375 162 360 168" class="control-arrow"/>
  <path d="M535 149 C550 158 565 162 580 168" class="control-arrow"/>
  <path d="M620 149 C675 156 745 160 790 168" class="control-arrow"/>

  <rect x="125" y="420" width="710" height="48" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="449" class="footer">Documentation overview only. It does not prove every subsystem is implemented or physically validated.</text>
</svg>

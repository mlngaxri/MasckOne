name: Retention V25 boundary binding

on:
  pull_request:
    paths:
      - "src/masck_one/retention_quick_release_tactile*.py"
      - "tests/test_retention_quick_release_tactile*.py"
      - ".github/workflows/retention-v25-boundary-binding.yml"
  workflow_dispatch:

jobs:
  v25-boundary-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install canonical development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile V25 boundary audit
        run: python -m py_compile src/masck_one/retention_quick_release_tactile_v25.py
      - name: Run V25 boundary regressions
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v25.py

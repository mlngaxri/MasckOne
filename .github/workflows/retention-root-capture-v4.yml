name: Retention root capture V4

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - 'src/masck_one/structural_frame_retention_root_capture_v*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_capture_v*.py'
      - '.github/workflows/retention-root-capture-v4.yml'
  pull_request:
    paths:
      - 'src/masck_one/structural_frame_retention_root_capture_v*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_capture_v*.py'
      - '.github/workflows/retention-root-capture-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-section-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile capture chain
        run: |
          python -m py_compile \
            src/masck_one/structural_frame_retention_root_capture_v1.py \
            src/masck_one/structural_frame_retention_root_capture_v2.py \
            src/masck_one/structural_frame_retention_root_capture_v3.py \
            src/masck_one/structural_frame_retention_root_capture_v4.py
      - name: Verify capture geometry and residual section
        run: |
          python -m pytest -q \
            tests/test_structural_frame_retention_root_capture_v1.py \
            tests/test_structural_frame_retention_root_capture_v2.py \
            tests/test_structural_frame_retention_root_capture_v3.py \
            tests/test_structural_frame_retention_root_capture_v4.py

# Digital nominal-section gate only. It proves the controlled throat leaves positive
# residual retainer material. It does not establish material suitability, insertion
# force, strength, fatigue, wear, contamination tolerance, or physical validation.

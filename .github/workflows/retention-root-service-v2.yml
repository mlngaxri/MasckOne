name: Retention root service V2

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/structural_frame_retention_root_service.py"
      - "src/masck_one/structural_frame_retention_root_service_v2.py"
      - "src/masck_one/structural_frame_retention_roots.py"
      - "tests/test_structural_frame_retention_root_service.py"
      - "tests/test_structural_frame_retention_root_service_v2.py"
      - ".github/workflows/retention-root-service-v2.yml"

permissions:
  contents: read

concurrency:
  group: retention-root-service-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-side-service-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile service integration sources
        run: |
          python -m py_compile \
            src/masck_one/structural_frame_retention_root_service.py \
            src/masck_one/structural_frame_retention_root_service_v2.py
      - name: Verify local and cross-side service packaging
        run: |
          python -m pytest -q \
            tests/test_structural_frame_retention_root_service.py \
            tests/test_structural_frame_retention_root_service_v2.py

# Digital sequential-service packaging gate only. It proves each realized pin-withdrawal
# and split-retainer installation extension clears the opposite yoke and seated hardware.
# It does not establish whole-head removal, force, strength, fatigue, wet usability,
# contamination tolerance, accessibility on a manufactured shell, or physical validation.

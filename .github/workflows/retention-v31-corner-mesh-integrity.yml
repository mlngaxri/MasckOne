name: Retention V31 corner mesh integrity

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v1[67].py"
      - "src/masck_one/retention_quick_release_tactile_v2[6].py"
      - "src/masck_one/retention_quick_release_tactile_v30.py"
      - "src/masck_one/retention_quick_release_tactile_v31.py"
      - "tests/test_retention_quick_release_tactile_v31.py"
      - ".github/workflows/retention-v31-corner-mesh-integrity.yml"

permissions:
  contents: read

concurrency:
  group: retention-v31-corner-mesh-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corner-mesh-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V31 and mesh dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v16.py \
            src/masck_one/retention_quick_release_tactile_v17.py \
            src/masck_one/retention_quick_release_tactile_v26.py \
            src/masck_one/retention_quick_release_tactile_v30.py \
            src/masck_one/retention_quick_release_tactile_v31.py
      - name: Verify clearance-corner mesh integrity
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v31.py

# V31 extends V26 mesh-integrity provenance from nominal clearance to every V30
# nominal/maximum radial and anti-rotation side-clearance authority corner. It does
# not promote sampled CAD evidence to continuous clearance or manufactured-stack proof.

name: Retention V32 interstation midpoint clearance

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v12.py"
      - "src/masck_one/retention_quick_release_tactile_v1[67].py"
      - "src/masck_one/retention_quick_release_tactile_v30.py"
      - "src/masck_one/retention_quick_release_tactile_v31.py"
      - "src/masck_one/retention_quick_release_tactile_v32.py"
      - "tests/test_retention_quick_release_tactile_v32.py"
      - ".github/workflows/retention-v32-interstation-midpoints.yml"

permissions:
  contents: read

concurrency:
  group: retention-v32-interstation-midpoints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interstation-midpoint-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V32 and clearance dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v12.py \
            src/masck_one/retention_quick_release_tactile_v16.py \
            src/masck_one/retention_quick_release_tactile_v17.py \
            src/masck_one/retention_quick_release_tactile_v30.py \
            src/masck_one/retention_quick_release_tactile_v31.py \
            src/masck_one/retention_quick_release_tactile_v32.py
      - name: Verify interstation midpoint clearance
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v32.py

# V32 adds every adjacent V12 station midpoint to the four-corner, two-mesh raw-kernel
# clearance screen. It halves the maximum unsampled longitudinal interval but does not
# claim continuous swept-volume clearance or manufactured tolerance-stack closure.

name: Retention root capture V3

on:
  pull_request:
    paths:
      - 'src/masck_one/structural_frame_retention_root_capture_v1.py'
      - 'src/masck_one/structural_frame_retention_root_capture_v2.py'
      - 'src/masck_one/structural_frame_retention_root_capture_v3.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_capture_v1.py'
      - 'tests/test_structural_frame_retention_root_capture_v2.py'
      - 'tests/test_structural_frame_retention_root_capture_v3.py'
      - '.github/workflows/retention-root-capture-v3.yml'
  workflow_dispatch:

jobs:
  retention-root-capture-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Verify positive capture and explicit elastic installation demand
        run: python -m pytest -q tests/test_structural_frame_retention_root_capture_v1.py tests/test_structural_frame_retention_root_capture_v2.py tests/test_structural_frame_retention_root_capture_v3.py

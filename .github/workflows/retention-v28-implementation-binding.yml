name: Retention V28 implementation binding

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v1[6-7].py"
      - "src/masck_one/retention_quick_release_tactile_v2[6-8].py"
      - "tests/test_retention_quick_release_tactile_v28.py"
      - ".github/workflows/retention-v28-implementation-binding.yml"

permissions:
  contents: read

concurrency:
  group: retention-v28-implementation-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implementation-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V28 and mesh dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v16.py \
            src/masck_one/retention_quick_release_tactile_v17.py \
            src/masck_one/retention_quick_release_tactile_v26.py \
            src/masck_one/retention_quick_release_tactile_v27.py \
            src/masck_one/retention_quick_release_tactile_v28.py
      - name: Verify realized sampler implementation binding
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v28.py

# Focused digital regression gate. Exact realized V16/V17 transverse point sets must
# implement the V27 schedule and declared clearances. This does not establish continuous
# swept-volume clearance, manufactured tolerance, force, fatigue, wet-use or physical fit.

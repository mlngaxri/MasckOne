name: Retention V35 sixteenth clearance corners

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v*.py"
      - "tests/test_retention_quick_release_tactile_v35.py"
      - ".github/workflows/retention-v35-sixteenth-clearance-corners.yml"

permissions:
  contents: read

concurrency:
  group: retention-v35-sixteenth-clearance-corners-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sixteenth-clearance-corners:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V35 and clearance-corner dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v21.py \
            src/masck_one/retention_quick_release_tactile_v30.py \
            src/masck_one/retention_quick_release_tactile_v34.py \
            src/masck_one/retention_quick_release_tactile_v35.py
      - name: Verify sixteenth-travel clearance-corner screen
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v35.py

# Sampled digital B-rep regression gate only. This does not establish continuous
# swept-volume clearance, manufactured tolerance-stack closure, strength, fatigue,
# wet-use, wear, contamination, comfort, or physical service performance.

name: Retention root capture V1

on:
  pull_request:
    paths:
      - 'src/masck_one/structural_frame_retention_root_capture_v1.py'
      - 'src/masck_one/structural_frame_retention_root_service*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_capture_v1.py'
      - '.github/workflows/retention-root-capture-v1.yml'
  workflow_dispatch:

jobs:
  retention-root-capture-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Verify positive capture and evidence firewall
        run: python -m pytest -q tests/test_structural_frame_retention_root_capture_v1.py

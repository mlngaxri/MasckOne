name: Retention root service V3

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/structural_frame_retention_root_service.py"
      - "src/masck_one/structural_frame_retention_root_service_v2.py"
      - "src/masck_one/structural_frame_retention_root_service_v3.py"
      - "src/masck_one/structural_frame_retention_roots.py"
      - "tests/test_structural_frame_retention_root_service.py"
      - "tests/test_structural_frame_retention_root_service_v2.py"
      - "tests/test_structural_frame_retention_root_service_v3.py"
      - ".github/workflows/retention-root-service-v3.yml"

permissions:
  contents: read

concurrency:
  group: retention-root-service-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-service-sequencing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile service integration sources
        run: |
          python -m py_compile \
            src/masck_one/structural_frame_retention_root_service.py \
            src/masck_one/structural_frame_retention_root_service_v2.py \
            src/masck_one/structural_frame_retention_root_service_v3.py
      - name: Verify complete root service packaging chain
        run: |
          python -m pytest -q \
            tests/test_structural_frame_retention_root_service.py \
            tests/test_structural_frame_retention_root_service_v2.py \
            tests/test_structural_frame_retention_root_service_v3.py

# Digital sequential-service packaging gate only. V3 proves each local operation clears
# the other seated retention component, complementing V1 frame/yoke and V2 cross-side
# checks. It does not establish shell access, whole-head removal, service force/time,
# strength, fatigue, wet usability, contamination tolerance, or physical validation.

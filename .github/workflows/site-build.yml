name: Build cinematic website

on:
  workflow_dispatch:
  push:
    paths:
      - '.site-build/run.flag'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Repair mask and mobile handoff
        run: |
          python .site-build/repair_mask_mobile.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          s = Path('website/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/masck-site.js').write_text('\n'.join(scripts))
          local = 'https://raw.githubusercontent.com/mlngaxri/MasckOne/main/website/images/masck-hero-mask-v2.webp'
          fallback = 'https://masck-one.vercel.app/images/masck-one-product-angle.webp'
          assert 'masck-hero-caucasian-mask-v1.webp' not in s
          assert 'updateHeaderVisibility();' not in s
          assert '/* Mobile stability repair */' in s
          if local in s:
              with Image.open('website/images/masck-hero-mask-v2.webp') as im:
                  im.load()
                  assert 'A' in im.getbands()
                  assert im.width >= 300 and im.height >= 300
              assert s.count(local) == 2
          else:
              assert s.count(fallback) >= 2
          PY
          node --check /tmp/masck-site.js
      - name: Commit repaired website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/index.html website/images/masck-hero-mask-v2.webp
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair hero mask and mobile handoff'
            git push origin HEAD:main
          fi

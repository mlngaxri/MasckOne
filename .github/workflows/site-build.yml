name: Build cinematic website

on:
  workflow_dispatch:
  push:
    paths:
      - '.site-build/run.flag'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate plain navbar
        run: |
          python .site-build/refine_nav_plain.py
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('website/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/masck-site.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/masck-site.js
      - name: Commit refined website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'refine: restore outline-free navbar'
            git push origin HEAD:main
          fi

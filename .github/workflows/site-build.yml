name: Build cinematic website

on:
  workflow_dispatch:
  push:
    paths:
      - '.site-build/run.flag'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Tidy and validate final website
        run: |
          python .site-build/tidy_v7.py
          python .site-build/systems_experience_v9.py
          python .site-build/awwwards_finish_v11.py
          python .site-build/awwwards_finish_v12.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          s = Path('website/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/masck-site.js').write_text('\n'.join(scripts))

          alpha_src = 'https://raw.githubusercontent.com/mlngaxri/MasckOne/main/website/images/masck-hero-mask-v2.webp'
          assert 'masck-hero-caucasian-mask-v1.webp' not in s
          assert 'https://masck-one.vercel.app/images/masck-one-product-angle.webp' not in s
          assert s.count(alpha_src) == 2
          assert 'updateHeaderVisibility();' not in s
          assert '/* Mobile stability repair */' in s
          assert '/* Responsive performance polish v3 */' in s
          assert '/* Editorial finish polish v4 */' in s
          assert '/* Micro finish polish v5 */' in s
          assert '/* Continuous approved product mask v10 */' in s
          assert '/* Systems live circuit v9 */' in s
          assert '/* Awwwards editorial finish v11 */' in s
          assert '/* End Awwwards editorial finish v11 */' in s
          assert '/* Awwwards art-direction finish v12 */' in s
          assert '/* End Awwwards art-direction finish v12 */' in s
          assert 'Instrument+Serif' in s
          assert '--display:"Instrument Serif"' in s
          assert 'background-image:none;' in s
          assert '.band-track{animation-duration:38s}' in s
          assert '.systems-copy h2{' in s
          assert 'class="hero-editorial-kicker"' in s
          assert 'class="nav-status"' in s
          assert 'data-index="01"' in s and 'data-index="02"' in s and 'data-index="03"' in s
          assert 'data-page-no="01"' in s and 'data-page-no="02"' in s
          assert '@keyframes heroLineIn' in s
          assert '.nav button::before' in s
          assert '.page[data-page-no]::before' in s
          assert 'sy=desktop()?sy+(scrollY-sy)*.13:scrollY;' in s
          assert 'window.Lenis&&desktop()?' in s
          assert 'const bandTracks=[' in s
          assert 'setOrbitMotion(textOpacity>.012)' in s
          assert 'setHaloMotion(haloOpacity>.012)' in s
          assert 'env(safe-area-inset-top)' in s
          assert 'aria-current="page">Architecture' in s
          assert 'loading="lazy" decoding="async"' in s

          # One untouched approved product image from hero through Architecture.
          assert 'hero-mask-wrap hero-subject' not in s
          assert 'hero-mask-product' not in s
          assert 'const heroSubject=' not in s
          assert 'heroSubject.style.opacity' not in s
          assert s.count('mask-journey hero-mask-single') == 1
          assert s.count('class="hero-mask-art"') == 1
          assert '<img class="hero-mask-art"' in s
          assert '<svg class="hero-mask-art"' not in s
          assert 'masck-aperture-mask' not in s
          assert 'data-aperture=' not in s
          assert "journey.style.opacity='1'" in s
          assert 'journey.style.opacity=String(show)' not in s
          assert '.mask-journey.hero-mask-single::before' in s
          assert '.mask-journey.hero-mask-single::after' in s
          assert 'content:none!important' in s

          # Systems remains one scroll-driven cinematic chamber.
          assert s.count('class="systems-experience"') == 1
          assert s.count('class="systems-sticky"') == 1
          assert s.count('class="systems-circuit"') == 1
          assert s.count('data-systems-core') >= 1
          assert 'const systemExperience=' in s
          assert "if(active==='system'&&systemExperience&&systemSticky)" in s
          assert 'systemsTimelineFill.style.transform' in s
          assert 'systems-copy-flow' in s and 'systems-copy-motion' in s
          assert 'systems-flow-visual' in s and 'systems-motion-visual' in s

          # Approved source file still has real transparency and valid dimensions.
          with Image.open('website/images/masck-hero-mask-v2.webp') as src:
              im = src.convert('RGBA')
          w, h = im.size
          assert w >= 300 and h >= 300
          amin, amax = im.getchannel('A').getextrema()
          assert amin < 32 and amax > 240, (amin, amax)
          PY
          node --check /tmp/masck-site.js
      - name: Commit polished website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'refine: Awwwards art direction and hierarchy'
            git push origin HEAD:main
          fi

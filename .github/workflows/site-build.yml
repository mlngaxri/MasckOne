name: Build cinematic website

on:
  workflow_dispatch:
    
  push:
    paths:
      - '.site-build/run.flag'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Tidy and validate final website
        run: |
          python .site-build/tidy_v7.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from collections import deque
          import re

          s = Path('website/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/masck-site.js').write_text('\n'.join(scripts))

          alpha_src = 'https://raw.githubusercontent.com/mlngaxri/MasckOne/main/website/images/masck-hero-mask-v2.webp'
          assert 'masck-hero-caucasian-mask-v1.webp' not in s
          assert 'https://masck-one.vercel.app/images/masck-one-product-angle.webp' not in s
          assert s.count(alpha_src) == 2  # preload + the one SVG product image
          assert 'updateHeaderVisibility();' not in s
          assert '/* Mobile stability repair */' in s
          assert '/* Responsive performance polish v3 */' in s
          assert '/* Editorial finish polish v4 */' in s
          assert '/* Micro finish polish v5 */' in s
          assert '/* Continuous transparent product mask v8 */' in s
          assert 'sy=desktop()?sy+(scrollY-sy)*.13:scrollY;' in s
          assert 'window.Lenis&&desktop()?' in s
          assert 'const bandTracks=[' in s
          assert 'setOrbitMotion(textOpacity>.012)' in s
          assert 'setHaloMotion(haloOpacity>.012)' in s
          assert 'env(safe-area-inset-top)' in s
          assert 'aria-current="page">Architecture' in s
          assert 'loading="lazy" decoding="async"' in s

          # Exactly one product object from first hero frame through handoff.
          assert 'hero-mask-wrap hero-subject' not in s
          assert 'hero-mask-product' not in s
          assert 'const heroSubject=' not in s
          assert 'heroSubject.style.opacity' not in s
          assert s.count('mask-journey hero-mask-single') == 1
          assert s.count('class="hero-mask-art"') == 1
          assert "journey.style.opacity='1'" in s
          assert 'journey.style.opacity=String(show)' not in s

          # Three explicit cut-through apertures are part of the render layer,
          # independent of page background/glows and of the source artwork.
          assert s.count('id="masck-aperture-mask"') == 1
          assert s.count('mask="url(#masck-aperture-mask)"') == 1
          for aperture in ('left-eye', 'right-eye', 'nose'):
              assert s.count(f'data-aperture="{aperture}"') == 1
          assert '.mask-journey.hero-mask-single::before' in s
          assert '.mask-journey.hero-mask-single::after' in s
          assert 'content:none!important' in s

          # The underlying product file must still decode with alpha and retain
          # both real eye openings. The SVG layer guarantees the nose opening.
          with Image.open('website/images/masck-hero-mask-v2.webp') as src:
              im = src.convert('RGBA')
          w, h = im.size
          assert 'A' in im.getbands()
          assert w >= 300 and h >= 300
          px = im.getchannel('A').load()
          transparent = lambda x, y: px[x, y] <= 24

          outside = set(); q = deque()
          for x in range(w):
              for y in (0, h - 1):
                  if transparent(x, y) and (x, y) not in outside:
                      outside.add((x, y)); q.append((x, y))
          for y in range(h):
              for x in (0, w - 1):
                  if transparent(x, y) and (x, y) not in outside:
                      outside.add((x, y)); q.append((x, y))
          while q:
              x, y = q.popleft()
              for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0 <= nx < w and 0 <= ny < h and (nx, ny) not in outside and transparent(nx, ny):
                      outside.add((nx, ny)); q.append((nx, ny))

          seen = set(outside); regions = []
          min_area = max(120, int(w * h * 0.0012))
          for y in range(1, h - 1):
              for x in range(1, w - 1):
                  if (x, y) in seen or not transparent(x, y):
                      continue
                  area = 0; minx = maxx = x; miny = maxy = y
                  q = deque([(x, y)]); seen.add((x, y))
                  while q:
                      cx, cy = q.popleft(); area += 1
                      minx=min(minx,cx); maxx=max(maxx,cx); miny=min(miny,cy); maxy=max(maxy,cy)
                      for nx, ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                          if 0 <= nx < w and 0 <= ny < h and (nx, ny) not in seen and transparent(nx, ny):
                              seen.add((nx, ny)); q.append((nx, ny))
                  if area >= min_area:
                      regions.append((area,minx,miny,maxx,maxy))
          regions.sort(reverse=True)
          print('source alpha eye regions:', regions[:4])
          assert len(regions) >= 2, f'expected two transparent eye openings, found {regions}'
          first, second = regions[:2]
          assert first[3] - first[1] >= w * .20
          assert second[3] - second[1] >= w * .06
          assert abs(((first[2]+first[4])/2) - ((second[2]+second[4])/2)) <= h * .08
          PY
          node --check /tmp/masck-site.js
      - name: Commit polished website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: finalize one transparent product mask'
            git push origin HEAD:main
          fi

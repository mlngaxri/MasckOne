name: Build cinematic website

on:
  workflow_dispatch:
  push:
    paths:
      - '.site-build/run.flag'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate final product hero
        run: |
          python .site-build/refine_product_hero.py
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('website/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/masck-site.js').write_text('\n'.join(scripts))
          assert 'updateHeaderVisibility();' not in s
          assert 'masck-hero-caucasian-mask-v1.webp' not in s
          assert s.count('masck-hero-mask-v2.webp') == 2
          asset = Path('website/images/masck-hero-mask-v2.webp').read_bytes()
          assert len(asset) == 48844
          assert asset[:4] == b'RIFF' and asset[8:12] == b'WEBP'
          PY
          node --check /tmp/masck-site.js
      - name: Commit refined website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/index.html website/images/masck-hero-mask-v2.webp
          if ! git diff --cached --quiet; then
            git commit -m 'website: finalize product-first landing hero'
            git push origin HEAD:main
          fi

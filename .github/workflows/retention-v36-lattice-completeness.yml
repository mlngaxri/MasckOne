name: Retention V36 lattice completeness

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v*.py"
      - "tests/test_retention_quick_release_tactile_v36.py"
      - ".github/workflows/retention-v36-lattice-completeness.yml"

permissions:
  contents: read

concurrency:
  group: retention-v36-lattice-completeness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lattice-completeness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V36 and longitudinal authorities
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v12.py \
            src/masck_one/retention_quick_release_tactile_v32.py \
            src/masck_one/retention_quick_release_tactile_v33.py \
            src/masck_one/retention_quick_release_tactile_v34.py \
            src/masck_one/retention_quick_release_tactile_v35.py \
            src/masck_one/retention_quick_release_tactile_v36.py
      - name: Verify complete sixteenth longitudinal lattice
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v36.py

# Sampling-completeness regression gate only. This does not establish continuous
# swept-volume clearance, manufactured tolerance-stack closure, strength, fatigue,
# wet-use, wear, contamination, comfort, or physical service performance.

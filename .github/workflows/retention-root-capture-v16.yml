name: Retention root capture V16

on:
  pull_request:
    paths:
      - 'src/masck_one/structural_frame_retention_root_capture_v*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_capture_v*.py'
      - '.github/workflows/retention-root-capture-v16.yml'
  workflow_dispatch:

jobs:
  capture-v16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile capture chain
        run: python -m compileall -q src/masck_one/structural_frame_retention_root_capture_v*.py
      - name: Test capture chain through V16
        run: python -m pytest -q tests/test_structural_frame_retention_root_capture_v*.py

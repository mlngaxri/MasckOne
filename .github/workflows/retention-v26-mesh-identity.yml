name: Retention V26 mesh identity

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v1[6-7].py"
      - "src/masck_one/retention_quick_release_tactile_v2[5-6].py"
      - "tests/test_retention_quick_release_tactile_v26.py"
      - ".github/workflows/retention-v26-mesh-identity.yml"

permissions:
  contents: read

concurrency:
  group: retention-v26-mesh-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesh-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V26 and mesh dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v16.py \
            src/masck_one/retention_quick_release_tactile_v17.py \
            src/masck_one/retention_quick_release_tactile_v25.py \
            src/masck_one/retention_quick_release_tactile_v26.py
      - name: Verify transverse mesh identity provenance
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v26.py

# Focused successor gate only. V26 proves sampled mesh uniqueness, family disjointness
# and central inversion symmetry. It does not establish continuous swept clearance,
# manufactured tolerance closure, strength, fatigue, wet use, wear or physical fit.

name: Treatment guided V5 verification

on:
  push:
    branches: [codex/treatment-live117-reconcile-20260909]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: treatment-guided-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guided-spring-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact treatment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile promoted treatment integration
        run: |
          python -m py_compile \
            src/masck_one/treatment_collision_kernel_v2.py \
            src/masck_one/treatment_terminal_datum_preload_v5.py \
            src/masck_one/treatment_guided_preload_spring_v5.py
      - name: Verify terminal V5 and guided spring V5
        run: python -m pytest -q tests/test_treatment_terminal_datum_preload_v5.py tests/test_treatment_guided_preload_spring_v5.py

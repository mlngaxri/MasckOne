name: Retention V30 clearance corners

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
  pull_request:
    paths:
      - 'src/masck_one/retention_quick_release_tactile*.py'
      - 'tests/test_retention_quick_release_tactile_v30.py'
      - '.github/workflows/retention-v30-clearance-corners.yml'

jobs:
  v30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_retention_quick_release_tactile_v30.py

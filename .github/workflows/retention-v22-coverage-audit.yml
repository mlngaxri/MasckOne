name: Retention V22 coverage audit

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v1[2-9].py"
      - "src/masck_one/retention_quick_release_tactile_v2[0-2].py"
      - "tests/test_retention_quick_release_tactile_v2[0-2].py"
      - ".github/workflows/retention-v22-coverage-audit.yml"

permissions:
  contents: read

concurrency:
  group: retention-v22-coverage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V22 and its travel-schedule dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v12.py \
            src/masck_one/retention_quick_release_tactile_v18.py \
            src/masck_one/retention_quick_release_tactile_v19.py \
            src/masck_one/retention_quick_release_tactile_v20.py \
            src/masck_one/retention_quick_release_tactile_v21.py \
            src/masck_one/retention_quick_release_tactile_v22.py
      - name: Verify exact sixteenth-grid coverage provenance
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v22.py

# Focused successor gate for V22 schedule/provenance evidence. This proves the
# independently implemented V18-V21 travel schedules collectively reconstruct the
# intended 1/16 grid and preserve the bounded maximum sampled travel gap. It does
# not promote sampled digital B-rep evidence to continuous swept-volume, tolerance,
# strength, fatigue, wet-use, wear, contamination, comfort, or physical validation.

name: retention-root-service-v8

on:
  pull_request:
    paths:
      - 'src/masck_one/structural_frame_retention_root_service*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_service*.py'
      - '.github/workflows/retention-root-service-v8.yml'
  workflow_dispatch:

jobs:
  service-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Compile service verification chain
        run: python -m compileall -q src/masck_one/structural_frame_retention_root_service.py src/masck_one/structural_frame_retention_root_service_v2.py src/masck_one/structural_frame_retention_root_service_v3.py src/masck_one/structural_frame_retention_root_service_v4.py src/masck_one/structural_frame_retention_root_service_v5.py src/masck_one/structural_frame_retention_root_service_v6.py src/masck_one/structural_frame_retention_root_service_v7.py src/masck_one/structural_frame_retention_root_service_v8.py
      - name: Test service verification chain
        run: pytest -q tests/test_structural_frame_retention_root_service.py tests/test_structural_frame_retention_root_service_v2.py tests/test_structural_frame_retention_root_service_v3.py tests/test_structural_frame_retention_root_service_v4.py tests/test_structural_frame_retention_root_service_v5.py tests/test_structural_frame_retention_root_service_v6.py tests/test_structural_frame_retention_root_service_v7.py tests/test_structural_frame_retention_root_service_v8.py

name: Retention V27 resolution binding

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v1[6-7].py"
      - "src/masck_one/retention_quick_release_tactile_v2[5-7].py"
      - "tests/test_retention_quick_release_tactile_v27.py"
      - ".github/workflows/retention-v27-resolution-binding.yml"

permissions:
  contents: read

concurrency:
  group: retention-v27-resolution-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sampler-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V27 and sampler dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v16.py \
            src/masck_one/retention_quick_release_tactile_v17.py \
            src/masck_one/retention_quick_release_tactile_v25.py \
            src/masck_one/retention_quick_release_tactile_v26.py \
            src/masck_one/retention_quick_release_tactile_v27.py
      - name: Verify sampler resolution cannot silently regress
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v27.py

# Provenance gate only. It prevents silent coarsening of the accepted sampled
# transverse mesh and loss of the interstitial half-cell phase. It does not
# establish continuous clearance, tolerance-stack closure, strength, wear,
# wet-use performance, comfort, safety, or physical validation.

name: Retention V37 collision binding

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v3[0-7].py"
      - "tests/test_retention_quick_release_tactile_v37.py"
      - ".github/workflows/retention-v37-collision-binding.yml"

permissions:
  contents: read

concurrency:
  group: retention-v37-collision-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collision-coverage-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V37 and direct coverage dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v30.py \
            src/masck_one/retention_quick_release_tactile_v32.py \
            src/masck_one/retention_quick_release_tactile_v33.py \
            src/masck_one/retention_quick_release_tactile_v34.py \
            src/masck_one/retention_quick_release_tactile_v35.py \
            src/masck_one/retention_quick_release_tactile_v36.py \
            src/masck_one/retention_quick_release_tactile_v37.py
      - name: Verify complete-lattice collision evidence binding
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v37.py

# Focused exact-head gate. V37 binds the complete 1/16 longitudinal lattice to
# the validated pose counts and evidence digests of the collision-screen layers
# that own station, half, quarter, eighth and odd-sixteenth positions. This is
# sampled digital B-rep evidence only, not continuous swept-volume, manufactured
# tolerance-stack, strength, fatigue, wet-use, wear or physical validation.

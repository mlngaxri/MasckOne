name: Retention root capture V17

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - 'src/masck_one/structural_frame_retention_root_capture_v*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_capture_v*.py'
      - '.github/workflows/retention-root-capture-v17.yml'
  pull_request:
    paths:
      - 'src/masck_one/structural_frame_retention_root_capture_v*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_capture_v*.py'
      - '.github/workflows/retention-root-capture-v17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axial-corner-enumeration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile capture chain
        run: python -m compileall -q src/masck_one/structural_frame_retention_root_capture_v*.py
      - name: Verify complete capture chain and physical axial corners
        run: python -m pytest -q tests/test_structural_frame_retention_root_capture_v*.py

# Drawing-level dimensional evidence only. This gate does not establish process
# capability, dynamic performance, wear, fatigue, release force, or physical validation.

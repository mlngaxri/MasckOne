name: Cell 6 current-main rebind

on:
  push:
    branches:
      - cell6/structural-frame-reaction-loop-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cell6/structural-frame-reaction-loop-v1
          fetch-depth: 0
      - name: Rebind onto live main without weakening geometry gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          LIVE_MAIN="$(git rev-parse origin/main)"
          python - "$LIVE_MAIN" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path('src/masck_one/structural_frame_realization.py')
          text = path.read_text()
          live = sys.argv[1]
          text, n = re.subn(r'^SOURCE_MAIN_SHA = "[0-9a-f]{40}"$', f'SOURCE_MAIN_SHA = "{live}"', text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('failed to update structural frame source-main binding')
          path.write_text(text)
          PY
          git add src/masck_one/structural_frame_realization.py
          if ! git diff --cached --quiet; then
            git commit -m "rebind: structural frame to live main"
          fi
          git push origin HEAD:cell6/structural-frame-reaction-loop-v1

name: Retention root service V4

on:
  push:
    paths:
      - 'src/masck_one/structural_frame_retention_root_service*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_service*.py'
      - '.github/workflows/retention-root-service-v4.yml'
  pull_request:
    paths:
      - 'src/masck_one/structural_frame_retention_root_service*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_service*.py'
      - '.github/workflows/retention-root-service-v4.yml'

jobs:
  retention-root-service-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src/masck_one/structural_frame_retention_root_service.py src/masck_one/structural_frame_retention_root_service_v2.py src/masck_one/structural_frame_retention_root_service_v3.py src/masck_one/structural_frame_retention_root_service_v4.py
      - run: pytest -q tests/test_structural_frame_retention_root_service.py tests/test_structural_frame_retention_root_service_v2.py tests/test_structural_frame_retention_root_service_v3.py tests/test_structural_frame_retention_root_service_v4.py

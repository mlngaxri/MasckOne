name: Retention root service V5

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - 'src/masck_one/structural_frame_retention_root_service*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_service*.py'
      - '.github/workflows/retention-root-service-v5.yml'
  pull_request:
    paths:
      - 'src/masck_one/structural_frame_retention_root_service*.py'
      - 'src/masck_one/structural_frame_retention_roots.py'
      - 'tests/test_structural_frame_retention_root_service*.py'
      - '.github/workflows/retention-root-service-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilateral-service-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile service chain
        run: python -m py_compile src/masck_one/structural_frame_retention_root_service.py src/masck_one/structural_frame_retention_root_service_v{2,3,4,5}.py
      - name: Verify service chain and separation reserve
        run: python -m pytest -q tests/test_structural_frame_retention_root_service.py tests/test_structural_frame_retention_root_service_v{2,3,4,5}.py

# Conservative digital packaging evidence only. This gate does not establish hand/tool
# ergonomics, release force, contamination tolerance, wet usability, or physical validation.

name: Masck One engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engineering-integrity:
    runs-on: ubuntu-latest
    # Preserve every current source/brand gate and allow measured margin for
    # per-solid STEP round-trip verification plus package-integrity verification.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind tested source provenance
        id: source-provenance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"
          checked_out_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$checked_out_sha" != "$TESTED_SHA" ]]; then
            echo "::error::Checked-out commit $checked_out_sha does not match github.sha $TESTED_SHA"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Pull-request head/base provenance is malformed"
              exit 1
            fi
            source_head_sha="$PR_HEAD_SHA"
            source_base_sha="$PR_BASE_SHA"
            release_base_sha="$source_base_sha"
            tested_base_parent_sha="$(git rev-parse 'HEAD^1')"
            tested_head_parent_sha="$(git rev-parse 'HEAD^2')"
            if [[ "$tested_base_parent_sha" != "$source_base_sha" ]]; then
              echo "::error::Tested merge base parent $tested_base_parent_sha does not match event base $source_base_sha"
              exit 1
            fi
            if [[ "$tested_head_parent_sha" != "$source_head_sha" ]]; then
              echo "::error::Tested merge head parent $tested_head_parent_sha does not match event head $source_head_sha"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$source_base_sha" "$source_head_sha"; then
              echo "::error::Event base $source_base_sha is not an ancestor of source head $source_head_sha. Rebase/reconstruct on current main before treating CI as exact-source evidence."
              exit 1
            fi
            source_head_tree_sha="$(git rev-parse "${source_head_sha}^{tree}")"
            if [[ "$source_head_tree_sha" != "$checked_out_tree_sha" ]]; then
              echo "::error::PR head tree $source_head_tree_sha differs from tested merge tree $checked_out_tree_sha. Rebase/reconstruct on current main before treating CI as exact-source evidence."
              exit 1
            fi
            source_kind="PULL_REQUEST_BASE_ANCESTOR_HEAD_TREE_EQ_TESTED_MERGE_TREE"
            cat > /tmp/masck-one-ci-source-provenance.json <<EOF
          {
            "schema": "MASCK_ONE_CI_SOURCE_PROVENANCE_V1",
            "event_name": "$EVENT_NAME",
            "source_kind": "$source_kind",
            "source_head_sha": "$source_head_sha",
            "source_base_sha": "$source_base_sha",
            "source_head_tree_sha": "$source_head_tree_sha",
            "tested_commit_sha": "$checked_out_sha",
            "tested_tree_sha": "$checked_out_tree_sha",
            "tested_base_parent_sha": "$tested_base_parent_sha",
            "tested_head_parent_sha": "$tested_head_parent_sha",
            "source_base_is_ancestor_of_source_head": true,
            "source_head_tree_equals_tested_tree": true
          }
          EOF
          else
            source_head_sha="$checked_out_sha"
            source_head_tree_sha="$checked_out_tree_sha"
            source_base_sha=""
            release_base_sha="$source_head_sha"
            source_kind="PUSH_HEAD"
            cat > /tmp/masck-one-ci-source-provenance.json <<EOF
          {
            "schema": "MASCK_ONE_CI_SOURCE_PROVENANCE_V1",
            "event_name": "$EVENT_NAME",
            "source_kind": "$source_kind",
            "source_head_sha": "$source_head_sha",
            "source_base_sha": null,
            "source_head_tree_sha": "$source_head_tree_sha",
            "tested_commit_sha": "$checked_out_sha",
            "tested_tree_sha": "$checked_out_tree_sha",
            "tested_base_parent_sha": null,
            "tested_head_parent_sha": null,
            "source_base_is_ancestor_of_source_head": null,
            "source_head_tree_equals_tested_tree": true
          }
          EOF
          fi

          echo "release_base_sha=$release_base_sha" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
          echo "source_head_tree_sha=$source_head_tree_sha" >> "$GITHUB_OUTPUT"
          echo "tested_commit_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "tested_tree_sha=$checked_out_tree_sha" >> "$GITHUB_OUTPUT"
          cat /tmp/masck-one-ci-source-provenance.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Validate engineering authority contract
        run: python -m masck_one.authority

      - name: Validate MASCK brand/product identity contract
        run: python -m masck_one.brand_identity

      - name: Repository preflight
        run: python -m masck_one.preflight

      - name: Iteration 11 nasal subsystem preflight
        run: python -m masck_one.nasal_preflight

      - name: Iteration 12 interface boundary preflight
        run: python -m masck_one.boundary_preflight

      - name: Iteration 13 interface attachment preflight
        run: python -m masck_one.attachment_preflight

      - name: Iteration 14 contact simulation preflight
        run: python -m masck_one.contact_simulation_preflight

      - name: Iteration 15 structural frame preflight
        run: python -m masck_one.structural_frame_preflight

      - name: Iteration 16 Class-A surface workflow preflight
        run: python -m masck_one.surface_workflow_preflight

      # The engineering suite is CPU-bound OpenCascade work and is independent
      # per test. Run serially it exceeded this job's 45-minute budget: the test
      # step alone consumed 44m05s before being cancelled, which skipped the CAD
      # smoke build, the provenance verification and the package-integrity check
      # below, and left the structural-frame lane unable to complete a single
      # run. Distributed across the runner's cores the same suite completes in
      # single-digit minutes with no test skipped, removed or weakened.
      #
      # --dist loadscope keeps each module's tests on one worker so the suite's
      # many module-scoped CAD fixtures are built once per module rather than
      # once per worker. Measured on 4 cores: loadscope 6m14s, default load
      # 8m28s, both with 0 failures across 712 tests.
      - name: Unit and integration tests
        run: python -m pytest -n auto --dist loadscope --durations=20

      - name: Deterministic CAD smoke build
        env:
          MASCK_ONE_RELEASE_BASE_SHA: ${{ steps.source-provenance.outputs.release_base_sha }}
          MASCK_ONE_SOURCE_HEAD_SHA: ${{ steps.source-provenance.outputs.source_head_sha }}
          MASCK_ONE_SOURCE_HEAD_TREE_SHA: ${{ steps.source-provenance.outputs.source_head_tree_sha }}
          MASCK_ONE_TESTED_COMMIT_SHA: ${{ steps.source-provenance.outputs.tested_commit_sha }}
          MASCK_ONE_TESTED_TREE_SHA: ${{ steps.source-provenance.outputs.tested_tree_sha }}
        run: python -m masck_one.cli --output /tmp/masck-one-generated

      - name: Verify exact release source provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          report = json.loads(
              Path("/tmp/masck-one-generated/build_report.json").read_text(encoding="utf-8")
          )
          registry = json.loads(
              Path("/tmp/masck-one-generated/component_registry.json").read_text(encoding="utf-8")
          )
          provenance = json.loads(
              Path("/tmp/masck-one-ci-source-provenance.json").read_text(encoding="utf-8")
          )
          binding = report.get("release_source_binding")
          if not isinstance(binding, dict) or binding.get("binding_state") != "CI_EXACT_BOUND":
              raise SystemExit("build_report.json is not exact-CI source bound")

          expected_release_base = provenance["source_base_sha"] or provenance["source_head_sha"]
          expected = {
              "release_base_sha": expected_release_base,
              "source_head_sha": provenance["source_head_sha"],
              "source_head_tree_sha": provenance["source_head_tree_sha"],
              "tested_commit_sha": provenance["tested_commit_sha"],
              "tested_tree_sha": provenance["tested_tree_sha"],
          }
          for field, value in expected.items():
              if binding.get(field) != value:
                  raise SystemExit(
                      f"build_report release_source_binding {field} {binding.get(field)!r} "
                      f"!= CI provenance {value!r}"
                  )

          registry_baseline = registry.get("source_main_sha")
          if not isinstance(registry_baseline, str) or re.fullmatch(r"[0-9a-f]{40}", registry_baseline) is None:
              raise SystemExit("component registry source_main_sha is malformed")
          ancestor = subprocess.run(
              ["git", "merge-base", "--is-ancestor", registry_baseline, expected_release_base],
              check=False,
          )
          if ancestor.returncode != 0:
              raise SystemExit(
                  "component registry source baseline is not an ancestor of the exact release base"
              )
          PY

      - name: Verify generated package integrity
        run: python -m masck_one.release_package /tmp/masck-one-generated

      - name: Preserve source-bound CAD review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masck-one-generated-source-${{ steps.source-provenance.outputs.source_head_sha }}-tested-${{ steps.source-provenance.outputs.tested_commit_sha }}
          path: |
            /tmp/masck-one-generated
            /tmp/masck-one-ci-source-provenance.json
          if-no-files-found: error
          retention-days: 3

name: Retention V33 quarter travel corners

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v19.py"
      - "src/masck_one/retention_quick_release_tactile_v3[0-3].py"
      - "tests/test_retention_quick_release_tactile_v33.py"
      - ".github/workflows/retention-v33-quarter-travel-corners.yml"

permissions:
  contents: read

concurrency:
  group: retention-v33-quarter-travel-corners-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quarter-travel-corners:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V33 and direct dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v19.py \
            src/masck_one/retention_quick_release_tactile_v30.py \
            src/masck_one/retention_quick_release_tactile_v31.py \
            src/masck_one/retention_quick_release_tactile_v32.py \
            src/masck_one/retention_quick_release_tactile_v33.py
      - name: Verify quarter-travel clearance-corner evidence
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v33.py

# Focused sampled digital B-rep gate. V33 extends the four clearance-authority-corner
# screen from canonical stations plus midpoints to quarter-travel resolution. It does
# not establish continuous swept-volume clearance, manufactured tolerance-stack closure,
# strength, fatigue, wet-use, wear, contamination, comfort, or physical validation.

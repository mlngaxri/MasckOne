            tests/test_structural_frame_retention_verification_v8.py \
            tests/test_structural_frame_retention_verification_v9.py \
            tests/test_structural_frame_retention_verification_v10.py \
            tests/test_structural_frame_retention_verification_v11.py \
            tests/test_structural_frame_retention_verification_v12.py \
            tests/test_structural_frame_retention_verification_v13.py \
            tests/test_structural_frame_retention_verification_v14.py \
            tests/test_structural_frame_retention_verification_v15.py \
            tests/test_structural_frame_retention_verification_v16.py \

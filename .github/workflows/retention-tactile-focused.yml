name: Retention tactile focused verification

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]

permissions:
  contents: read

concurrency:
  group: retention-tactile-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-release-tactile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile owner-local retention sources
        run: |
          python -m py_compile \
            src/masck_one/mechanical_interface_graph.py \
            src/masck_one/retention_quick_release_tactile.py \
            src/masck_one/retention_quick_release_tactile_v2.py \
            src/masck_one/retention_quick_release_tactile_v3.py \
            src/masck_one/retention_quick_release_tactile_v4.py \
            src/masck_one/retention_quick_release_tactile_v5.py \
            src/masck_one/retention_quick_release_tactile_v6.py \
            src/masck_one/retention_quick_release_tactile_v7.py \
            src/masck_one/retention_quick_release_tactile_v8.py \
            src/masck_one/retention_quick_release_tactile_v9.py \
            src/masck_one/retention_quick_release_tactile_v10.py \
            src/masck_one/structural_frame_retention_roots.py \
            src/masck_one/structural_frame_retention_clevis_bores.py \
            src/masck_one/structural_frame_retention_verification_v2.py \
            src/masck_one/structural_frame_retention_verification_v3.py \
            src/masck_one/structural_frame_retention_verification_v4.py \
            src/masck_one/structural_frame_retention_verification_v5.py \
            src/masck_one/structural_frame_retention_verification_v6.py \
            src/masck_one/structural_frame_retention_verification_v7.py \
            src/masck_one/structural_frame_retention_verification_v8.py \
            src/masck_one/structural_frame_retention_verification_v9.py \
            src/masck_one/structural_frame_retention_verification_v10.py \
            src/masck_one/structural_frame_retention_verification_v11.py \
            src/masck_one/structural_frame_retention_verification_v12.py \
            src/masck_one/structural_frame_retention_verification_v13.py \
            src/masck_one/structural_frame_retention_verification_v14.py \
            src/masck_one/structural_frame_retention_verification_v15.py \
            src/masck_one/structural_frame_retention_verification_v16.py
      - name: Verify positive retention graph, structural roots, and selected tactile successor
        run: |
          python -m pytest -q \
            tests/test_mechanical_interface_graph.py \
            tests/test_structural_frame_retention_clevis_bores.py \
            tests/test_structural_frame_retention_verification_v2.py \
            tests/test_structural_frame_retention_verification_v3.py \
            tests/test_structural_frame_retention_verification_v4.py \
            tests/test_structural_frame_retention_verification_v5.py \
            tests/test_structural_frame_retention_verification_v6.py \
            tests/test_structural_frame_retention_verification_v7.py \
            tests/test_structural_frame_retention_verification_v8.py \
            tests/test_structural_frame_retention_verification_v9.py \
            tests/test_structural_frame_retention_verification_v10.py \
            tests/test_structural_frame_retention_verification_v11.py \
            tests/test_structural_frame_retention_verification_v12.py \
            tests/test_structural_frame_retention_verification_v13.py \
            tests/test_structural_frame_retention_verification_v14.py \
            tests/test_structural_frame_retention_verification_v15.py \
            tests/test_structural_frame_retention_verification_v16.py \
            tests/test_retention_quick_release_tactile_v3.py \
            tests/test_retention_quick_release_tactile_v4.py \
            tests/test_retention_quick_release_tactile_v5.py \
            tests/test_retention_quick_release_tactile_v6.py \
            tests/test_retention_quick_release_tactile_v7.py \
            tests/test_retention_quick_release_tactile_v8.py \
            tests/test_retention_quick_release_tactile_v9.py \
            tests/test_retention_quick_release_tactile_v10.py

# Branch-level mechanism verification only. V1 and V2 remain explicit superseded
# tactile evidence. V3 repairs the rib/bumper conflict, V4 screens the full nominal
# release travel, V5 adds a bounded single-axis clearance/travel grid, V6 adds a Y/Z
# grid, V7 corrects that grid to respect the spool rail's radial clearance, V8
# strengthens transverse boundary sampling, V9 inserts every inter-station travel
# midpoint, and V10 halves that remaining sampled travel interval again by adding
# quarter points. Structural-root V2 independently fails closed on B-rep query errors.
# Structural-root V3 rejects incomplete or impossible capture-pin engagement through
# the nominal yoke bore. Structural-root V4 rejects material bilateral pin/bore capture
# mismatch. Structural-root V5 also rejects material bilateral mismatch where the two
# root counterparts capture into the source structural frame. Structural-root V6 binds
# each source-frame capture to the physical volume of its frame counterpart, rejecting
# impossible over-capture metrics or stale Boolean evidence. Structural-root V7 then
# cross-checks generator-recorded source capture against the independent B-rep result.
# Structural-root V8 independently measures pin-to-yoke material clearance and requires
# generator-recorded radial clearance to agree with the authoritative pin/bore contract.
# Structural-root V9 verifies each split retainer is axially contained by its capture-pin
# groove and retains enough radial material beyond the shaft to form a digital axial stop.
# Structural-root V10 verifies installed retainer axial registration to the groove center.
# Structural-root V11 independently checks groove-bottom seating clearance and rejects
# volumetric retainer/capture-pin interference. Structural-root V12 independently rejects
# installed split-retainer interference with the local frame clevis or nominal yoke material.
# Structural-root V13 independently verifies the actual headed pin B-rep is seated against
# the proximal clevis face and retains radial material beyond the shaft for an axial stop.
# Structural-root V14 binds independently measured capture-pin overall length and head
# radius back to the structural authority constants, rejecting coherent outer-geometry drift.
# Structural-root V15 binds actual pin material volume to the analytical shaft/head/groove
# authority, detecting internal material drift that can preserve V14's outer dimensions.
# Structural-root V16 independently binds bilateral pin placement/material symmetry through
# measured B-rep centers of mass, catching equal-volume translation or asymmetric drift.
# The clevis-bore repair is also compiled and regression-gated here so a future owner-head
# change cannot silently restore the solid-clevis capture-pin interference.
# These are focused-CI gates. Parent Cell 6 and complete-repo CI remain separate release
# gates. No continuous clearance proof, manufactured tolerance, force, wet-use, wear,
# contamination or tactile-performance claim is promoted here.

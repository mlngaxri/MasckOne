name: Retention tactile focused verification

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]

permissions:
  contents: read

concurrency:
  group: retention-tactile-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-release-tactile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile owner-local retention sources
        run: |
          python -m py_compile \
            src/masck_one/mechanical_interface_graph.py \
            src/masck_one/retention_quick_release_tactile.py \
            src/masck_one/retention_quick_release_tactile_v2.py \
            src/masck_one/retention_quick_release_tactile_v3.py \
            src/masck_one/retention_quick_release_tactile_v4.py \
            src/masck_one/retention_quick_release_tactile_v5.py \
            src/masck_one/retention_quick_release_tactile_v6.py \
            src/masck_one/retention_quick_release_tactile_v7.py \
            src/masck_one/retention_quick_release_tactile_v8.py \
            src/masck_one/retention_quick_release_tactile_v9.py \
            src/masck_one/retention_quick_release_tactile_v10.py \
            src/masck_one/structural_frame_retention_roots.py \
            src/masck_one/structural_frame_retention_verification_v2.py
      - name: Verify positive retention graph, structural roots, and selected tactile successor
        run: |
          python -m pytest -q \
            tests/test_mechanical_interface_graph.py \
            tests/test_structural_frame_retention_verification_v2.py \
            tests/test_retention_quick_release_tactile_v3.py \
            tests/test_retention_quick_release_tactile_v4.py \
            tests/test_retention_quick_release_tactile_v5.py \
            tests/test_retention_quick_release_tactile_v6.py \
            tests/test_retention_quick_release_tactile_v7.py \
            tests/test_retention_quick_release_tactile_v8.py \
            tests/test_retention_quick_release_tactile_v9.py \
            tests/test_retention_quick_release_tactile_v10.py

# Branch-level mechanism verification only. V1 and V2 remain explicit superseded
# tactile evidence. V3 repairs the rib/bumper conflict, V4 screens the full nominal
# release travel, V5 adds a bounded single-axis clearance/travel grid, V6 adds a Y/Z
# grid, V7 corrects that grid to respect the spool rail's radial clearance, V8
# strengthens transverse boundary sampling, V9 inserts every inter-station travel
# midpoint, and V10 halves that remaining sampled travel interval again by adding
# quarter points. Structural-root V2 independently fails closed on B-rep query errors
# and is an explicit focused-CI gate. Parent Cell 6 and complete-repo CI remain
# separate release gates. No continuous clearance proof, manufactured tolerance,
# force, wet-use, wear, contamination or tactile-performance claim is promoted here.

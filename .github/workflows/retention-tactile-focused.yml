name: Retention tactile focused verification

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]

permissions:
  contents: read

concurrency:
  group: retention-tactile-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-release-tactile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile owner-local retention sources
        run: |
          python -m py_compile \
            src/masck_one/mechanical_interface_graph.py \
            src/masck_one/retention_quick_release_tactile.py \
            src/masck_one/retention_quick_release_tactile_v2.py \
            src/masck_one/retention_quick_release_tactile_v3.py \
            src/masck_one/retention_quick_release_tactile_v4.py \
            src/masck_one/retention_quick_release_tactile_v5.py \
            src/masck_one/retention_quick_release_tactile_v6.py \
            src/masck_one/retention_quick_release_tactile_v7.py \
            src/masck_one/retention_quick_release_tactile_v8.py \
            src/masck_one/retention_quick_release_tactile_v9.py \
            src/masck_one/retention_quick_release_tactile_v10.py \
            src/masck_one/retention_quick_release_tactile_v11.py \
            src/masck_one/retention_quick_release_tactile_v12.py \
            src/masck_one/retention_quick_release_tactile_v13.py \
            src/masck_one/retention_quick_release_tactile_v14.py \
            src/masck_one/structural_frame_retention_roots.py \
            src/masck_one/structural_frame_retention_root_service.py \
            src/masck_one/structural_frame_retention_clevis_bores.py \
            src/masck_one/structural_frame_retention_verification_v2.py \
            src/masck_one/structural_frame_retention_verification_v3.py \
            src/masck_one/structural_frame_retention_verification_v4.py \
            src/masck_one/structural_frame_retention_verification_v5.py \
            src/masck_one/structural_frame_retention_verification_v6.py \
            src/masck_one/structural_frame_retention_verification_v7.py \
            src/masck_one/structural_frame_retention_verification_v8.py \
            src/masck_one/structural_frame_retention_verification_v9.py \
            src/masck_one/structural_frame_retention_verification_v10.py \
            src/masck_one/structural_frame_retention_verification_v11.py \
            src/masck_one/structural_frame_retention_verification_v12.py \
            src/masck_one/structural_frame_retention_verification_v13.py \
            src/masck_one/structural_frame_retention_verification_v14.py \
            src/masck_one/structural_frame_retention_verification_v15.py \
            src/masck_one/structural_frame_retention_verification_v16.py \
            src/masck_one/structural_frame_retention_verification_v17.py \
            src/masck_one/structural_frame_retention_verification_v18.py \
            src/masck_one/structural_frame_retention_verification_v19.py \
            src/masck_one/structural_frame_retention_verification_v20.py \
            src/masck_one/structural_frame_retention_verification_v21.py
      - name: Verify positive retention graph, structural roots, and selected tactile successor
        run: |
          python -m pytest -q \
            tests/test_mechanical_interface_graph.py \
            tests/test_structural_frame_retention_root_service.py \
            tests/test_structural_frame_retention_clevis_bores.py \
            tests/test_structural_frame_retention_verification_v2.py \
            tests/test_structural_frame_retention_verification_v3.py \
            tests/test_structural_frame_retention_verification_v4.py \
            tests/test_structural_frame_retention_verification_v5.py \
            tests/test_structural_frame_retention_verification_v6.py \

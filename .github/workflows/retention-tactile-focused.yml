            tests/test_retention_quick_release_tactile_v7.py \
            tests/test_retention_quick_release_tactile_v8.py \
            tests/test_retention_quick_release_tactile_v9.py \
            tests/test_retention_quick_release_tactile_v10.py \
            tests/test_retention_quick_release_tactile_v11.py \
            tests/test_retention_quick_release_tactile_v12.py \
            tests/test_retention_quick_release_tactile_v13.py \
            tests/test_retention_quick_release_tactile_v14.py

# Branch-level mechanism verification only. V1 and V2 remain explicit superseded
# tactile evidence. V3 repairs the rib/bumper conflict, V4 screens nominal release
# travel, V5-V8 expand bounded clearance sampling, V9-V11 progressively halve the
# remaining sampled travel interval, and V11 also fails closed on invalid/unavailable
# OCC clearance evidence. V12 cryptographically binds the exact station schedule and
# proves every V10 station remains registered. V13 independently audits that bound
# schedule for retained/full-release endpoints, exact travel span, strict monotonicity
# and uniform spacing. V14 cryptographically binds every sampled transverse/travel pose
# and its rigid-guide intersection evidence. Structural-root V2-V21 remain regression-
# gated, including fail-closed B-rep handling, capture geometry, pin/retainer registration,
# integrated collision checks, source-reaction provenance and complete root-architecture
# provenance. Root-service corridors and the clevis-bore repair remain compiled and gated
# here. These are focused-CI gates. Parent Cell 6 and complete-repo CI remain separate
# release gates. No continuous clearance proof, manufactured tolerance, force, wet-use,
# wear, contamination or tactile-performance claim is promoted here.

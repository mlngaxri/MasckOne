name: Diagnose existing exterior eye fillet
on:
  push:
    branches: [codex/eye-roll-diagnostic-20260907]
    paths: ['scripts/diagnose_eye_roll.py']
permissions:
  contents: read
jobs:
  eye-roll-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/diagnose_eye_roll.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eye-roll-diagnostic-${{ github.sha }}
          path: /tmp/masck-eye-diagnostic
          retention-days: 3

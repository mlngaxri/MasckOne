name: Cell 6 first-failure diagnostic

on:
  push:
    branches:
      - cell6/structural-frame-reaction-loop-v1

permissions:
  contents: read

jobs:
  first-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Capture first failing assertion
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -x -vv --tb=long 2>&1 | tee /tmp/cell6-first-failure.txt
      - name: Preserve diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cell6-first-pytest-failure-${{ github.sha }}
          path: /tmp/cell6-first-failure.txt
          if-no-files-found: error
          retention-days: 1

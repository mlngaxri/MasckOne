name: Retention V39 layer schedule binding

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v3[2-9].py"
      - "src/masck_one/retention_quick_release_tactile_v12.py"
      - "tests/test_retention_quick_release_tactile_v39.py"
      - ".github/workflows/retention-v39-layer-schedule-binding.yml"

permissions:
  contents: read

concurrency:
  group: retention-v39-layer-schedule-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-schedule-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V39
        run: python -m py_compile src/masck_one/retention_quick_release_tactile_v39.py
      - name: Verify collision-layer schedule identity binding
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v39.py

# Sampled digital B-rep provenance gate only. This does not establish continuous
# swept-volume clearance, manufactured tolerance closure, strength, fatigue,
# service force/time, wet-use, wear, contamination, comfort, or physical validation.

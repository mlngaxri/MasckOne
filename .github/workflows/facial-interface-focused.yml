name: Facial interface and regional control
on:
  pull_request:
    paths:
      - 'src/masck_one/facial_interface_*.py'
      - 'src/masck_one/regional_cleansing.py'
      - 'src/masck_one/cleansing_fit.py'
      - 'tests/test_facial_interface_bench.py'
      - 'tests/test_regional_cleansing.py'
      - 'docs/contracts/facial_interface_sources.json'
      - '.github/workflows/facial-interface-focused.yml'
permissions:
  contents: read
jobs:
  exact-head-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Regional hostile tests and geometry
        run: python -m pytest tests/test_regional_cleansing.py tests/test_facial_interface_bench.py
      - name: Unpowered off-face STEP export
        run: python -m masck_one.facial_interface_bench generated/cs018/fixture
      - uses: actions/upload-artifact@v4
        with:
          name: cs018-off-face-${{ github.event.pull_request.head.sha }}
          path: generated/cs018/fixture
          if-no-files-found: error

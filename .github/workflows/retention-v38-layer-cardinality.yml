name: Retention V38 layer cardinality

on:
  push:
    branches: [sol-high/retention-quick-release-20260909]
    paths:
      - "src/masck_one/retention_quick_release_tactile_v3[0-8].py"
      - "tests/test_retention_quick_release_tactile_v38.py"
      - ".github/workflows/retention-v38-layer-cardinality.yml"

permissions:
  contents: read

concurrency:
  group: retention-v38-layer-cardinality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-cardinality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact retention head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile V38 and direct collision-binding dependencies
        run: |
          python -m py_compile \
            src/masck_one/retention_quick_release_tactile_v37.py \
            src/masck_one/retention_quick_release_tactile_v38.py
      - name: Verify per-layer collision cardinality binding
        run: python -m pytest -q tests/test_retention_quick_release_tactile_v38.py

# Focused sampled-digital verification only. This gate proves each longitudinal
# authority contributes exactly the collision poses implied by its own schedule
# and shared transverse authority. It does not claim continuous swept-volume,
# manufactured tolerance, strength, fatigue, wet-use, wear or physical validation.

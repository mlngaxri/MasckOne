name: Treatment focused verification

on:
  push:
    branches: [codex/treatment-live117-reconcile-20260909]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: treatment-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact treatment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify terminal mechanics, source binding and centering studies
        run: python -m pytest -q tests/test_treatment_terminal_mechanics_v2.py tests/test_treatment_cell6_source_binding_v2.py tests/test_centering_multirate_v2.py

  reference-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact treatment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify tangent-filtered Boolean-free reference motion kernel
        run: python -m pytest -q tests/test_treatment_reference_geometry.py

  terminal-datum-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact treatment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify staged-unseat terminal datum V4 B-reps
        run: python -m pytest -q tests/test_treatment_terminal_datum_preload_v4.py

  guided-spring-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact treatment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify guided spring cassettes on V4 datums
        run: python -m pytest -q tests/test_treatment_guided_preload_spring_v4.py

  four-zone-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact treatment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile current V10 CAD sources
        run: |
          python -m py_compile \
            src/masck_one/treatment_reference_geometry.py \
            src/masck_one/treatment_terminal_datum_preload_v4.py \
            src/masck_one/treatment_guided_preload_spring.py \
            src/masck_one/treatment_mounted_four_zone_v9.py \
            src/masck_one/treatment_mounted_four_zone_v10.py
      - name: Verify source-correct four-zone V10 promotion candidate
        run: python -m pytest -q tests/test_treatment_mounted_four_zone_v10.py

  four-zone-v9-historical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    continue-on-error: true
    steps:
      - name: Checkout exact treatment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile historical V9 regression source
        run: |
          python -m py_compile \
            src/masck_one/treatment_reference_geometry.py \
            src/masck_one/treatment_terminal_datum_preload_v4.py \
            src/masck_one/treatment_guided_preload_spring.py \
            src/masck_one/treatment_mounted_four_zone_v9.py
      - name: Record historical V9 execution regression
        run: python -m pytest -q tests/test_treatment_mounted_four_zone_v9.py

# Fast branch-level design loop only. V10 is the selected promotion candidate.
# V9 remains executable regression evidence but cannot suppress V10 evaluation.
# Complete repository CI remains the release gate.

name: Treatment focused verification

on:
  push:
    branches: [codex/treatment-live117-reconcile-20260909]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: treatment-focused-${{ github.ref }}
  cancel-in-progress: true

x-common-steps: &common_steps
  - name: Checkout exact treatment head
    uses: actions/checkout@v4
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      fetch-depth: 1
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.13"
      cache: pip
  - name: Install project
    run: |
      python -m pip install --upgrade pip
      python -m pip install -e ".[dev]"

jobs:
  terminal-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      *common_steps
      - name: Verify terminal mechanics and centering studies
        run: python -m pytest -q tests/test_treatment_terminal_mechanics_v2.py tests/test_centering_multirate_v2.py

  terminal-datum:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      *common_steps
      - name: Verify terminal datum B-reps
        run: python -m pytest -q tests/test_treatment_terminal_datum_preload_v3.py

  guided-spring:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      *common_steps
      - name: Verify guided spring cassette B-reps
        run: python -m pytest -q tests/test_treatment_guided_preload_spring.py

  four-zone-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      *common_steps
      - name: Compile current V8 CAD sources
        run: |
          python -m py_compile \
            src/masck_one/treatment_mounted_four_zone.py \
            src/masck_one/treatment_mounted_four_zone_v2.py \
            src/masck_one/treatment_terminal_datum_preload_v3.py \
            src/masck_one/treatment_guided_preload_spring.py \
            src/masck_one/treatment_mounted_four_zone_v8.py
      - name: Verify complete four-zone V8
        run: python -m pytest -q tests/test_treatment_mounted_four_zone_v8.py

# Fast branch-level design loop only. Complete repository CI remains the release gate.

name: Treatment focused verification

on:
  push:
    branches: [codex/treatment-live117-reconcile-20260909]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: treatment-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  treatment-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact treatment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile current treatment mechanism
        run: |
          python -m py_compile \
            src/masck_one/treatment_carrier_counterpart.py \
            src/masck_one/treatment_mounted_four_zone.py \
            src/masck_one/treatment_mounted_four_zone_v2.py \
            src/masck_one/treatment_mounted_four_zone_v4.py \
            src/masck_one/treatment_mounted_four_zone_v6.py \
            src/masck_one/treatment_mounted_four_zone_v7.py \
            src/masck_one/treatment_terminal_datum_preload.py \
            src/masck_one/treatment_terminal_datum_preload_v2.py \
            studies/treatment_parallel_preload_flexure.py \
            studies/treatment_terminal_preload_material_trade.py \
            studies/treatment_terminal_event_phasing.py \
            studies/treatment_preload_robustness_doe.py \
            studies/treatment_buttery_terminal_profile_v2.py
      - name: Run current terminal closure tests
        run: |
          python -m pytest -q \
            tests/test_treatment_live117_reconciliation.py \
            tests/test_treatment_carrier_counterpart.py \
            tests/test_treatment_terminal_datum_preload.py \
            tests/test_treatment_terminal_datum_preload_v2.py \
            tests/test_treatment_parallel_preload_flexure.py \
            tests/test_treatment_terminal_preload_material_trade.py \
            tests/test_treatment_terminal_event_phasing.py \
            tests/test_treatment_buttery_terminal_profile_v2.py \
            tests/test_treatment_mounted_four_zone_v6.py \
            tests/test_treatment_mounted_four_zone_v7.py

# Fast branch-level design loop only. Complete repository CI remains the release gate.
